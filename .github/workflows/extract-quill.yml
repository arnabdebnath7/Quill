name: Extract Quill source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip extract]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          rm -rf /tmp/quill-src
          mkdir -p /tmp/quill-src
          unzip -q integrated-trading-life-journal.zip -d /tmp/quill-src
          cp -a /tmp/quill-src/. ./
          rm -f integrated-trading-life-journal.zip
          rm -f .github/workflows/extract-quill.yml
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Quill source [skip extract]" || exit 0
          git push
