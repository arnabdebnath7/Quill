<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quill · Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fefdf9; color: #1b1916; }
      @media (prefers-color-scheme: dark) { body { background: #0f1412; color: #f4f0e7; } }
      main { text-align: center; padding: 32px; max-width: 360px; }
      img { width: 96px; height: auto; margin-bottom: 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; line-height: 1.6; opacity: 0.75; font-size: 14px; }
      button { font: inherit; padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(127,127,127,0.35); background: transparent; color: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/quill-logo.svg" alt="" />
      <h1>You're offline</h1>
      <p>Quill needs a connection to load your journal. Your data is safe on the server — reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
